<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex" />
<title>Zen — the loop is the hero · tententoon experiment</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<style>
  :root {
    --line: rgba(255, 255, 255, 0.26);
    --line-hot: rgba(255, 255, 255, 0.62);
    --ink: rgba(255, 255, 255, 0.88);
    --ink-dim: rgba(255, 255, 255, 0.46);
    --glass: rgba(6, 6, 6, 0.42);
    --glass-hot: rgba(18, 18, 18, 0.58);
    --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", "Helvetica Neue", sans-serif;
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: #000;
    color: var(--ink);
    font-family: var(--sans);
    overflow: hidden;
    overscroll-behavior: none;
  }

  /* ── stage ─────────────────────────────────────────────────────── */
  #stage {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    touch-action: none;
    opacity: 0;
    transition: opacity 900ms ease;
    cursor: grab;
  }
  #stage.on { opacity: 1; }
  body.scrubbing #stage { cursor: grabbing; }
  body:not(.chrome):not(.scrubbing) { cursor: none; }
  body:not(.chrome):not(.scrubbing) #stage { cursor: none; }

  /* black veil for curated image swaps */
  #veil {
    position: fixed;
    inset: 0;
    background: #000;
    opacity: 0;
    pointer-events: none;
    transition: opacity 260ms ease-out;
  }
  #veil.dark { opacity: 1; transition-duration: 180ms; transition-timing-function: ease-in; }

  /* ── ambient layer: wordmark + badge ───────────────────────────── */
  #wordmark {
    position: fixed;
    right: 26px;
    bottom: 24px;
    font-family: var(--serif);
    font-size: 14px;
    font-weight: 400;
    letter-spacing: 0.42em;
    text-transform: lowercase;
    color: rgba(255, 255, 255, 0.82);
    margin-right: -0.42em; /* swallow the trailing letter-space */
    opacity: 0;
    pointer-events: none;
    transition: opacity 900ms ease;
  }
  #badge {
    position: fixed;
    left: 20px;
    bottom: max(18px, env(safe-area-inset-bottom));
    font-family: var(--sans);
    font-size: 10.5px;
    font-weight: 500;
    letter-spacing: 0.18em;
    text-transform: lowercase;
    color: var(--ink-dim);
    text-decoration: none;
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 8px 14px;
    background: var(--glass);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    opacity: 0;
    pointer-events: none;
    transition: opacity 600ms ease, color 200ms ease, border-color 200ms ease;
  }
  #badge:hover { color: var(--ink); border-color: var(--line-hot); }
  body.ambient #wordmark,
  body.ambient #badge {
    opacity: 1;
    pointer-events: auto;
    transition-duration: 250ms;
  }
  #wordmark { pointer-events: none !important; }

  /* soft scrim so summoned chrome reads on bright photos */
  #scrim {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    height: 42vh;
    background: linear-gradient(to top, rgba(0, 0, 0, 0.72), rgba(0, 0, 0, 0.34) 42%, transparent);
    opacity: 0;
    pointer-events: none;
    transition: opacity 700ms ease; /* slow dissolve out… */
  }
  body.chrome #scrim { opacity: 1; transition-duration: 300ms; /* …prompt fade in */ }

  /* ── control layer ─────────────────────────────────────────────── */
  #controls {
    position: fixed;
    left: 50%;
    bottom: max(64px, calc(env(safe-area-inset-bottom) + 56px));
    transform: translateX(-50%) translateY(10px);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    width: min(92vw, 620px);
    opacity: 0;
    pointer-events: none;
    transition: opacity 650ms ease, transform 650ms ease; /* dissolve out */
  }
  body.chrome #controls {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
    pointer-events: auto;
    transition-duration: 250ms; /* summoned promptly */
  }
  .bar {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 9px;
  }
  #controls button {
    appearance: none;
    font-family: var(--sans);
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.17em;
    text-transform: lowercase;
    line-height: 1;
    color: var(--ink);
    background: var(--glass);
    backdrop-filter: blur(12px) saturate(1.15);
    -webkit-backdrop-filter: blur(12px) saturate(1.15);
    border: 1px solid var(--line);
    border-radius: 999px;
    height: 44px;
    padding: 0 19px;
    cursor: pointer;
    touch-action: manipulation;
    transition: border-color 200ms ease, background 200ms ease, transform 140ms ease, color 200ms ease;
  }
  #controls button:hover { border-color: var(--line-hot); background: var(--glass-hot); }
  #controls button:active { transform: scale(0.95); }
  #controls button:focus-visible { outline: 1px solid var(--line-hot); outline-offset: 2px; }

  #play {
    width: 44px;
    padding: 0;
    display: grid;
    place-items: center;
  }
  #play svg { width: 15px; height: 15px; display: block; overflow: visible; }
  #play path { fill: currentColor; transition: opacity 180ms ease, transform 220ms ease; transform-origin: 50% 50%; }
  #play .ic-play  { opacity: 0; transform: scale(0.6); }
  #play .ic-pause { opacity: 1; transform: scale(1); }
  #play.paused .ic-play  { opacity: 1; transform: scale(1); }
  #play.paused .ic-pause { opacity: 0; transform: scale(0.6); }

  #dir, #len { min-width: 64px; }
  #dir span { display: inline-block; transition: transform 250ms ease; }

  .hint {
    font-size: 10.5px;
    font-weight: 400;
    letter-spacing: 0.14em;
    text-transform: lowercase;
    color: var(--ink-dim);
    text-shadow: 0 1px 8px rgba(0, 0, 0, 0.8);
    text-align: center;
    line-height: 1.7;
    padding: 0 14px;
  }
  .hint span { white-space: nowrap; }
  @media (hover: none) {
    .hint .kbd { display: none; } /* keyboard hint is noise on touch */
  }

  /* ── scrub hairline ─────────────────────────────────────────────── */
  #scrub {
    position: fixed;
    left: 0;
    top: 0;
    width: 100%;
    height: 3px;
    background: rgba(0, 0, 0, 0.45);
    box-shadow: 0 1px 10px rgba(0, 0, 0, 0.5);
    opacity: 0;
    pointer-events: none;
    transition: opacity 200ms ease;
  }
  #scrub i {
    display: block;
    height: 100%;
    width: 0;
    background: rgba(255, 255, 255, 0.95);
  }
  body.scrubbing #scrub { opacity: 1; }

  /* ── drop affordance ────────────────────────────────────────────── */
  #drop {
    position: fixed;
    inset: 14px;
    border: 1px dashed rgba(255, 255, 255, 0.45);
    border-radius: 14px;
    display: grid;
    place-items: center;
    background: rgba(0, 0, 0, 0.35);
    opacity: 0;
    pointer-events: none;
    transition: opacity 200ms ease;
  }
  #drop span {
    font-family: var(--serif);
    font-size: 15px;
    letter-spacing: 0.34em;
    text-transform: lowercase;
    color: rgba(255, 255, 255, 0.8);
  }
  body.drop-hover #drop { opacity: 1; }

  /* ── failure state ──────────────────────────────────────────────── */
  #fail {
    position: fixed;
    inset: 0;
    display: none;
    place-items: center;
    padding: 24px;
    text-align: center;
  }
  body.failed #fail { display: grid; }
  body.failed #stage, body.failed #controls { display: none; }
  #fail p {
    max-width: 26em;
    font-family: var(--serif);
    font-size: 17px;
    line-height: 1.7;
    color: rgba(255, 255, 255, 0.75);
    margin: 0;
  }
  #fail a { color: rgba(255, 255, 255, 0.9); }

  @media (max-width: 480px) {
    #controls { bottom: max(78px, calc(env(safe-area-inset-bottom) + 70px)); }
    #controls button { height: 48px; padding: 0 20px; font-size: 11.5px; }
    #play { width: 48px; }
    .bar { max-width: 330px; } /* wraps into two balanced thumb rows */
    #wordmark { right: 20px; bottom: 22px; font-size: 13px; }
  }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="scrim"></div>
<div id="veil"></div>
<div id="scrub"><i></i></div>
<div id="drop"><span>drop to swap</span></div>

<div id="controls">
  <div class="bar">
    <button id="play" aria-label="play or pause">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path class="ic-pause" d="M7 5h3.4v14H7zM13.6 5H17v14h-3.6z"/>
        <path class="ic-play" d="M8 5.2l11 6.8-11 6.8z"/>
      </svg>
    </button>
    <button id="dir" aria-label="zoom direction"><span>in ↓</span></button>
    <button id="len" aria-label="loop length">6s</button>
    <button id="photo">your photo</button>
    <button id="save">save frame</button>
  </div>
  <div class="hint"><span>or drop / paste anywhere</span> · <span>drag sideways to scrub</span><span class="kbd"> · <span>space to pause</span></span></div>
</div>

<div id="wordmark">tententoon</div>
<a id="badge" href="./index.html">01 · all experiments</a>

<div id="fail"><p></p></div>

<script type="module" src="/src/experiments/zen.ts"></script>
</body>
</html>

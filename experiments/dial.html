<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>One Knob · tententoon experiment</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<style>
  :root {
    --paper: #f4f1ea;
    --paper-deep: #e9e4d6;
    --ink: #1c1812;
    --ink-soft: #5d5648;
    --muted: #99917e;
    --accent: #d6481f;
    --accent-deep: #a83a1d;
    --dial: clamp(280px, 42vh, 380px);
    --mono: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas,
            "DejaVu Sans Mono", "Liberation Mono", monospace;
    --grot: "Helvetica Neue", Helvetica, Arial, "Liberation Sans",
            system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    overflow: hidden;
    background:
      radial-gradient(130% 105% at 50% -5%, #f9f6f0 0%, var(--paper) 52%, var(--paper-deep) 100%);
    color: var(--ink);
    font-family: var(--grot);
    -webkit-font-smoothing: antialiased;
    user-select: none;
    -webkit-user-select: none;
  }

  /* ── masthead ─────────────────────────────────────────────────── */
  .mast {
    position: fixed; top: 0; left: 0; right: 0; z-index: 6;
    display: flex; justify-content: space-between; gap: 16px;
    padding: 20px 28px;
    font: 500 10px/1.5 var(--mono);
    letter-spacing: .22em; text-transform: uppercase;
    color: var(--ink-soft);
    pointer-events: none;
  }
  .mast b { color: var(--ink); font-weight: 700; }

  /* ── ghost specimen numeral ───────────────────────────────────── */
  .ghost {
    position: fixed; top: -4vh; right: -1vw; z-index: 0;
    font: 800 30vh/1 var(--grot); letter-spacing: -.06em;
    color: rgba(28, 22, 12, .05);
    pointer-events: none;
  }

  /* ── stage (the poster plate) ─────────────────────────────────── */
  .stage-area {
    position: absolute; z-index: 1;
    top: 58px; left: 44px; right: 44px;
    bottom: calc(var(--dial) * 0.56 + 56px);
    display: flex; align-items: flex-end; justify-content: center;
  }
  .plate {
    position: relative;
    width: 60%; height: 70%;          /* placeholder until layout() runs */
    border-radius: 14px; overflow: hidden;
    background: #1b1712;
    box-shadow:
      0 44px 88px -28px rgba(31, 25, 15, .55),
      0 18px 38px -16px rgba(31, 25, 15, .34),
      0 0 0 1px rgba(31, 25, 15, .14);
  }
  .plate canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .plate-msg {
    position: absolute; inset: 0; display: grid; place-items: center;
    padding: 24px; text-align: center;
    font: 500 10px/1.9 var(--mono); letter-spacing: .26em; text-transform: uppercase;
    color: #cfc7b4;
    transition: opacity .45s ease;
  }
  .plate.ready .plate-msg { opacity: 0; }

  /* ── readout ──────────────────────────────────────────────────── */
  .readout {
    position: absolute; z-index: 3;
    right: calc(50% + var(--dial) / 2 + 44px);
    bottom: 84px;
    text-align: right;
  }
  .value {
    font-family: var(--grot);
    font-weight: 800;
    font-size: clamp(60px, calc((50vw - 280px) / 3), 176px);
    line-height: .92;
    letter-spacing: -.045em;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
    color: var(--ink);
    transition: color .35s ease;
    transform-origin: 100% 60%;
  }
  .caption {
    margin-top: 14px;
    font: 600 11px/1 var(--mono);
    letter-spacing: .26em; text-transform: uppercase;
    color: var(--muted);
    transition: color .35s ease;
  }
  .readout.tenten .value { color: var(--accent); }
  .readout.tenten .caption { color: var(--accent-deep); }
  .readout.snap .value { animation: snap .3s cubic-bezier(.3, 1.4, .5, 1); }
  @keyframes snap {
    0% { transform: scale(1); }
    40% { transform: scale(1.04); }
    100% { transform: scale(1); }
  }

  /* ── the dial ─────────────────────────────────────────────────── */
  .dial {
    position: absolute; z-index: 4;
    left: 50%; bottom: 30px;
    width: var(--dial); height: var(--dial);
    margin-left: calc(var(--dial) / -2);
    touch-action: none;
    cursor: grab;
  }
  .dial.grabbing { cursor: grabbing; }
  .dial svg {
    position: absolute; inset: 0; width: 100%; height: 100%;
    display: block; pointer-events: none; overflow: visible;
  }
  .tick { stroke: rgba(28, 22, 12, .3); stroke-width: .7; }
  .tick.major { stroke: rgba(28, 22, 12, .55); stroke-width: 1.3; }
  .tick.detent { stroke: var(--accent); stroke-width: 1.7; }
  .tick-label {
    fill: var(--ink-soft);
    font: 700 8px var(--mono);
    paint-order: stroke;
    stroke: rgba(244, 241, 234, .9);
    stroke-width: 2.4px;
  }
  .knob {
    position: absolute; inset: 11%;
    border-radius: 50%;
    background: repeating-conic-gradient(from 0deg,
      #ccc5b3 0deg 2.4deg, #f3efe5 2.4deg 4.8deg);
    box-shadow:
      0 36px 64px -18px rgba(28, 22, 12, .5),
      0 12px 24px -8px rgba(28, 22, 12, .35);
    transition: box-shadow .25s ease;
    will-change: transform;
  }
  .dial.grabbing .knob {
    box-shadow:
      0 22px 42px -16px rgba(28, 22, 12, .46),
      0 7px 14px -6px rgba(28, 22, 12, .3);
  }
  .face {
    position: absolute; inset: 7.5%;
    border-radius: 50%;
    background: radial-gradient(circle,
      #f8f4ea 0%, #ece7d8 52%, #ddd6c2 84%, #d4ccb6 100%);
    box-shadow: 0 3px 9px rgba(44, 36, 22, .3);
  }
  .dot {
    position: absolute; left: 50%; top: 10%;
    width: 6.5%; aspect-ratio: 1;
    transform: translateX(-50%);
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #ff7c4d, var(--accent) 55%, #8d2b11);
    box-shadow: inset 0 -1px 2px rgba(0, 0, 0, .3), 0 1px 2px rgba(255, 255, 255, .5);
  }
  .cap {
    position: absolute; left: 50%; top: 50%;
    width: 21%; aspect-ratio: 1;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    display: grid; place-items: center;
    box-shadow:
      inset 0 2px 5px rgba(44, 36, 22, .16),
      inset 0 -1px 2px rgba(255, 255, 255, .55),
      0 1px 1px rgba(255, 255, 255, .6);
    color: rgba(70, 60, 42, .5);
    font: 600 9px var(--mono);
    letter-spacing: .3em; text-indent: .3em; text-transform: uppercase;
  }
  /* fixed environmental lighting — must NOT rotate with the knob */
  .glare {
    position: absolute; inset: 11%;
    border-radius: 50%;
    pointer-events: none;
    background: linear-gradient(165deg,
      rgba(255, 255, 255, .42) 0%, rgba(255, 255, 255, 0) 38%,
      rgba(44, 36, 22, 0) 60%, rgba(44, 36, 22, .2) 100%);
    box-shadow:
      inset 0 2px 3px rgba(255, 255, 255, .55),
      inset 0 -4px 10px rgba(44, 36, 22, .22);
  }

  /* ── specimen block ───────────────────────────────────────────── */
  .spec {
    position: absolute; z-index: 3;
    left: calc(50% + var(--dial) / 2 + 52px);
    bottom: 66px;
    max-width: 250px;
    font: 500 10px/2.1 var(--mono);
    letter-spacing: .14em; text-transform: uppercase;
    color: var(--ink-soft);
  }
  .spec h2 {
    margin: 0 0 10px;
    font: 800 23px/1 var(--grot);
    letter-spacing: -.02em;
    color: var(--ink);
  }
  .spec .rule { border: 0; border-top: 1px solid rgba(28, 22, 12, .16); margin: 10px 0; }
  .spec .acc { color: var(--accent-deep); font-weight: 700; }

  /* ── badge ────────────────────────────────────────────────────── */
  .badge {
    position: fixed; left: 18px; bottom: 16px; z-index: 9;
    font: 600 10px/1 var(--mono);
    letter-spacing: .2em; text-transform: uppercase;
    color: var(--ink-soft); text-decoration: none;
    padding: 8px 12px;
    border: 1px solid rgba(28, 22, 12, .22);
    border-radius: 999px;
    background: rgba(248, 245, 238, .85);
    transition: color .2s ease, border-color .2s ease;
  }
  .badge:hover { color: var(--accent-deep); border-color: var(--accent-deep); }

  /* ── drop affordance ──────────────────────────────────────────── */
  body.drop-hover::after {
    content: "drop to swap the photo";
    position: fixed; inset: 14px; z-index: 50;
    border: 2px dashed var(--accent);
    border-radius: 18px;
    background: rgba(244, 241, 234, .84);
    display: grid; place-items: center;
    font: 700 13px var(--mono);
    letter-spacing: .34em; text-transform: uppercase;
    color: var(--accent-deep);
    pointer-events: none;
  }

  /* ── compact / mobile ─────────────────────────────────────────── */
  @media (max-width: 960px) {
    :root { --dial: min(72vw, 300px); }
    .mast { padding: 14px 16px; font-size: 9px; letter-spacing: .16em; }
    .mast .hint { display: none; }
    .ghost { font-size: 20vh; top: -2vh; }
    .readout {
      right: auto; left: 0; width: 100%;
      top: 46px; bottom: auto;
      text-align: center;
    }
    .value { font-size: clamp(56px, 19vw, 92px); transform-origin: 50% 60%; }
    .caption { margin-top: 9px; }
    .stage-area {
      top: 172px; left: 16px; right: 16px;
      bottom: calc(var(--dial) * 0.62 + 14px);
      align-items: center;
    }
    .dial { bottom: 14px; }
    .spec { display: none; }
    .badge { left: 10px; bottom: 10px; padding: 6px 9px; font-size: 9px; }
  }
</style>
</head>
<body>
  <header class="mast">
    <span><b>tententoon</b> · experiment 04 · one knob</span>
    <span class="hint">drop or paste a photo — it becomes the poster</span>
  </header>

  <div class="ghost" aria-hidden="true">04</div>

  <div class="stage-area" id="stageArea">
    <div class="plate" id="plate">
      <canvas id="gl"></canvas>
      <div class="plate-msg" id="plateMsg">inking the plate…</div>
    </div>
  </div>

  <div class="readout" id="readout">
    <div class="value" id="value">+0.0°</div>
    <div class="caption" id="caption">turn per copy</div>
  </div>

  <div class="dial" id="dial">
    <svg id="ticks" aria-hidden="true"></svg>
    <div class="knob" id="knob">
      <div class="face"></div>
      <div class="dot"></div>
      <div class="cap">twist</div>
    </div>
    <div class="glare"></div>
  </div>

  <aside class="spec">
    <h2>ONE KNOB</h2>
    <div>−1.5 … +1.5 × canonical twist</div>
    <div><span class="acc">0</span> = straight droste fall</div>
    <div><span class="acc">1</span> = the tententoon</div>
    <hr class="rule" />
    <div>flick it — it settles on a detent</div>
    <div>keys: ← → nudge · 0 / 1 jump</div>
  </aside>

  <a class="badge" href="./index.html">04 · all experiments</a>

  <script type="module" src="/src/experiments/dial.ts"></script>
</body>
</html>
